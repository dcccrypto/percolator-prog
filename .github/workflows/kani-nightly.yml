name: Kani nightly (no-verdict harnesses)

# Runs the Kani harnesses that had NO VERDICT (CBMC --harness-timeout) in the 2026-10-30/31 rc23
# triage -- exactly the rows of ci/kani-nightly-harnesses.tsv -- with longer budgets than a laptop
# can give. Not part of PR CI (hours of CBMC). Design + commands: docs/KANI.md.
#
# ONE JOB PER HARNESS (matrix built by the plan job): a dying harness can only lose its own row.
# Each harness runs under a memory cap below the runner's RAM (cgroup memory.max, default 13G of the
# 16 GB ubuntu-latest VM) and a wall limit below the job limit, so CBMC is killed first and the row
# says OOM / TIMEOUT instead of the runner VM dying and taking the row with it (run 41183972352: all
# 6 multi-harness tests shards died with "runner has received a shutdown signal", 0 rows).
# Verdicts: one row per harness (scripts/kani-nightly-shard.sh). The summary job is RED on any
# FAILED (counterexample), VACUOUS (SUCCESSFUL with an unsatisfied cover) or ERROR (build / name
# rot / crash) verdict and on any MISSING row. TIMEOUT / OOM = still no verdict: reported
# separately as warnings, never as a failure and never as a pass.
#
# NOTE: GitHub fires `schedule` only from the DEFAULT branch (main), and a schedule run checks out
# main's tree. Under the v2.2 no-main rule this file is not on main, so there is NO nightly: it runs
# by manual dispatch only (`gh workflow run kani-nightly.yml --ref <branch>`) until a human decides
# (accept manual dispatch, or a main-hosted scheduler that dispatches against the release branch).

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC (fires only from the default branch, see the NOTE above)
  workflow_dispatch:
    inputs:
      harness_timeout:
        description: "kani --harness-timeout per harness (e.g. 70m). Watchdog = this + 10 min; the plan refuses > 300m (job limit 350)."
        default: "70m"
      mem_cap:
        description: "memory cap per harness (cgroup memory.max, swap 0), below the runner's 16 GB RAM"
        default: "13G"
      max_parallel:
        description: "harness jobs running at once (leave runner slots for PR CI)"
        default: "8"
      groups:
        description: "comma list of groups to run (lib,tests,contlev,p3,p3-engine,growth) or 'all'"
        default: "all"

concurrency:
  group: kani-nightly-${{ github.ref }}-${{ github.event.inputs.groups || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KANI_VERSION: "0.67.0"

jobs:
  plan:
    name: plan (one job per harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      timeout: ${{ steps.plan.outputs.timeout }}
      memcap: ${{ steps.plan.outputs.memcap }}
      maxpar: ${{ steps.plan.outputs.maxpar }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@v4
      # Runs here (not only at the end) so a broken verdict rule or memory cap fails before hours of
      # CBMC. On this runner it also checks the real cgroup cap: a 1 GiB allocation under 128M -> OOM row.
      - name: self-test the verdict rules and the memory cap (fake kani)
        run: ./scripts/kani-nightly-selftest.sh
      - name: check the list against the tree, build the per-harness matrix
        id: plan
        env:
          IN_TIMEOUT: ${{ github.event.inputs.harness_timeout || '70m' }}
          IN_MEMCAP: ${{ github.event.inputs.mem_cap || '13G' }}
          IN_MAXPAR: ${{ github.event.inputs.max_parallel || '8' }}
          IN_GROUPS: ${{ github.event.inputs.groups || 'all' }}
        run: |
          set -euo pipefail
          [[ "$IN_TIMEOUT" =~ ^[0-9]+[smh]$ ]] || { echo "bad harness_timeout $IN_TIMEOUT"; exit 1; }
          [[ "$IN_MEMCAP" =~ ^[0-9]+[MG]$ ]] || { echo "bad mem_cap $IN_MEMCAP"; exit 1; }
          [[ "$IN_MAXPAR" =~ ^[1-9][0-9]?$ ]] || { echo "bad max_parallel $IN_MAXPAR"; exit 1; }
          [[ "$IN_GROUPS" =~ ^[a-z0-9,-]+$ ]] || { echo "bad groups"; exit 1; }
          python3 - <<'EOF'
          import json, os, re, subprocess, math
          rows = [l.rstrip('\n').split('\t') for l in open('ci/kani-nightly-harnesses.tsv') if l.strip() and not l.startswith('#')]
          dirs = {'lib': ['src'], 'tests': ['tests'], 'contlev': ['kani/contlev/src'], 'p3': ['kani/p3/src'],
                  'p3-engine': ['kani/p3-engine/src'], 'growth': ['kani/growth/src']}
          missing = []
          for g, h in rows:
              if g not in dirs: missing.append(f'{g}\t{h} (unknown group)'); continue
              fn = h.split('::')[-1]
              r = subprocess.run(['grep', '-rqE', rf'fn {re.escape(fn)}\b', *dirs[g]])
              if r.returncode != 0: missing.append(f'{g}\t{h}')
          if missing:
              print('::error::harness rows with no matching fn in the tree:\n' + '\n'.join(missing)); raise SystemExit(1)
          dup = sorted({h for _, h in rows if sum(1 for _, x in rows if x == h) > 1})
          if dup: print('::error::harness names listed twice: ' + ', '.join(dup)); raise SystemExit(1)
          want = os.environ['IN_GROUPS']
          sel = None if want == 'all' else set(want.split(','))
          if sel and not sel <= set(dirs): print(f'::error::unknown group(s) {sel - set(dirs)}'); raise SystemExit(1)
          t = os.environ['IN_TIMEOUT']
          tmin = int(t[:-1]) * {'s': 1 / 60, 'm': 1, 'h': 60}[t[-1]]
          wd = math.floor(tmin) + 10                     # the harness script's watchdog, minutes
          # job budget: checkout + kani install + build <= 25 min, then one harness <= watchdog + 1 min
          if 25 + wd + 1 > 350:
              print(f'::error::harness_timeout {t} (watchdog {wd}m) does not fit the 350 min job limit'); raise SystemExit(1)
          order = ['lib', 'tests', 'growth', 'p3', 'contlev', 'p3-engine']
          inc, expected = [], []
          for g in order:
              if sel and g not in sel: continue
              for i, h in enumerate(r[1] for r in rows if r[0] == g):
                  inc.append({'group': g, 'idx': i, 'harness': h}); expected.append(h)
          if not inc: print('::error::no harnesses selected'); raise SystemExit(1)
          if len(inc) > 256: print(f'::error::{len(inc)} harness jobs > GitHub matrix limit 256'); raise SystemExit(1)
          print(f'{len(rows)} harnesses listed; {len(expected)} selected = {len(inc)} jobs, '
                f'{os.environ["IN_MAXPAR"]} at a time, timeout {t} (watchdog {wd}m), mem cap {os.environ["IN_MEMCAP"]}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': inc}) + '\n')
              f.write('expected=' + json.dumps(expected) + '\n')
              f.write(f"timeout={t}\nmemcap={os.environ['IN_MEMCAP']}\nmaxpar={os.environ['IN_MAXPAR']}\n")
          EOF

  shard:
    name: "kani ${{ matrix.group }} ${{ matrix.harness }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub-hosted job limit is 360; the plan keeps build + watchdog below it
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.plan.outputs.maxpar) }}
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: checkout percolator-prog
        uses: actions/checkout@v4
        with: { path: percolator-prog }
      - name: load canonical deployed refs
        id: refs
        run: grep -E '^[A-Z_]+=' percolator-prog/ci/deployed-refs.env >> "$GITHUB_OUTPUT"
      - name: checkout engine (path dependency, pinned to ENGINE_CI_SIBLING)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator, path: percolator, ref: '${{ steps.refs.outputs.ENGINE_CI_SIBLING }}', token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: dtolnay/rust-toolchain@stable
      - name: cache kani
        id: kcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}-v1
      - name: install kani ${{ env.KANI_VERSION }}
        run: |
          if ! cargo kani --version 2>/dev/null | grep -q "$KANI_VERSION"; then
            cargo install --locked kani-verifier --version "$KANI_VERSION"
          fi
          cargo kani setup
          cargo kani --version
      - name: run harness (memory cap ${{ needs.plan.outputs.memcap }}, timeout ${{ needs.plan.outputs.timeout }})
        working-directory: percolator-prog
        env:
          GROUP: ${{ matrix.group }}
          HARNESS: ${{ matrix.harness }}
          TMO: ${{ needs.plan.outputs.timeout }}
          MEMCAP: ${{ needs.plan.outputs.memcap }}
        run: |
          nproc; free -m; df -h / | tail -1
          ./scripts/kani-nightly-shard.sh "$GROUP" "$HARNESS" "$TMO" "$RUNNER_TEMP/kn" "$MEMCAP"
          {
            echo "### kani $GROUP \`$HARNESS\`"
            echo '| harness | verdict | s | failed checks | covers | peak MiB |'
            echo '|---|---|---|---|---|---|'
            awk -F'\t' '{printf "| `%s` | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6}' "$RUNNER_TEMP/kn/verdicts.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload verdict + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-shard-${{ matrix.group }}-${{ matrix.idx }}
          path: ${{ runner.temp }}/kn
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: verdicts (red on FAILED / VACUOUS / ERROR / missing row)
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Only this run's shard artifacts (kani-shard-*): never an earlier kani-nightly-verdicts.
      - uses: actions/download-artifact@v4
        with: { pattern: kani-shard-*, path: shards }
      - name: merge and judge (one row per selected harness, else red)
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          set -uo pipefail
          mkdir -p out
          echo "$EXPECTED" | jq -r '.[]' > out/expected.txt
          ./scripts/kani-nightly-summary.sh shards out/expected.txt "$SHARD_RESULT" out > out/judge.log; rc=$?
          cat out/judge.log
          cat out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kani-nightly-verdicts
          path: out
          retention-days: 90
