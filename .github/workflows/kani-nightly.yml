name: Kani nightly (no-verdict harnesses)

# Runs the Kani harnesses that had NO VERDICT (CBMC --harness-timeout) in the 2026-10-30/31 rc23
# triage -- exactly the rows of ci/kani-nightly-harnesses.tsv -- with longer budgets than a laptop
# can give. Not part of PR CI (hours of CBMC). Design + commands: docs/KANI.md.
# LONG groups (Khubair R5, 2 Nov): bonds571 (kani/bonds571) and growth-occ (kani/growth occupancy
# harnesses, a glob row expanded at run time by scripts/kani-nightly-plan.py) run with
# long_timeout (default 315m, watchdog 325m) under the same memory cap.
#
# ONE JOB PER HARNESS (matrix built by the plan job): a dying harness can only lose its own row.
# Each harness runs under a memory cap below the runner's RAM (cgroup memory.max, default 13G of the
# 16 GB ubuntu-latest VM) and a wall limit below the job limit, so CBMC is killed first and the row
# says OOM / TIMEOUT instead of the runner VM dying and taking the row with it (run 41183972352: all
# 6 multi-harness tests shards died with "runner has received a shutdown signal", 0 rows).
# Verdicts: one row per harness (scripts/kani-nightly-shard.sh). The summary job is RED on any
# FAILED (counterexample), VACUOUS (SUCCESSFUL with an unsatisfied cover) or ERROR (build / name
# rot / crash) verdict and on any MISSING row. TIMEOUT / OOM = still no verdict: reported
# separately as warnings, never as a failure and never as a pass.
#
# NOTE: GitHub fires `schedule` only from the DEFAULT branch (main), and a schedule run checks out
# main's tree. Under the v2.2 no-main rule this file is not on main, so the `schedule` below never
# fires and there is NO automatic nightly: on the v2.2 branches it runs by manual dispatch only
# (`gh workflow run kani-nightly.yml --ref feat/v22-rc23-2026-10-22 -f groups=bonds571,growth-occ`)
# until a human picks a trigger (options: docs/KANI.md "Schedule").

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC (fires only from the default branch, see the NOTE above)
  workflow_dispatch:
    inputs:
      harness_timeout:
        description: "kani --harness-timeout per harness of the 85-list groups (e.g. 70m). Watchdog = this + 10 min; the plan refuses > 314m (job limit 350)."
        default: "70m"
      long_timeout:
        description: "kani --harness-timeout for the LONG groups bonds571 / growth-occ. Watchdog = this + 10 min; the plan refuses > 324m."
        default: "315m"
      solver:
        description: "optional kani --solver override for every selected harness (z3, cadical, kissat, minisat); empty = each harness's #[kani::solver] attribute"
        default: ""
      mem_cap:
        description: "memory cap per harness (cgroup memory.max, swap 0), below the runner's 16 GB RAM"
        default: "13G"
      max_parallel:
        description: "harness jobs running at once (leave runner slots for PR CI)"
        default: "8"
      groups:
        description: "comma list of groups to run (lib,tests,contlev,p3,p3-engine,growth,bonds571,growth-occ) or 'all'"
        default: "all"

concurrency:
  group: kani-nightly-${{ github.ref }}-${{ github.event.inputs.groups || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KANI_VERSION: "0.67.0"

jobs:
  plan:
    name: plan (one job per harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      solver: ${{ steps.plan.outputs.solver }}
      memcap: ${{ steps.plan.outputs.memcap }}
      maxpar: ${{ steps.plan.outputs.maxpar }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@v4
      # Runs here (not only at the end) so a broken verdict rule or memory cap fails before hours of
      # CBMC. On this runner it also checks the real cgroup cap: a 1 GiB allocation under 128M -> OOM row.
      - name: self-test the verdict rules and the memory cap (fake kani)
        run: ./scripts/kani-nightly-selftest.sh
      - name: check the list against the tree, build the per-harness matrix
        id: plan
        env:
          IN_TIMEOUT: ${{ github.event.inputs.harness_timeout || '70m' }}
          IN_LONG: ${{ github.event.inputs.long_timeout || '315m' }}
          IN_MEMCAP: ${{ github.event.inputs.mem_cap || '13G' }}
          IN_MAXPAR: ${{ github.event.inputs.max_parallel || '8' }}
          IN_GROUPS: ${{ github.event.inputs.groups || 'all' }}
          IN_SOLVER: ${{ github.event.inputs.solver || '' }}
        run: |
          python3 scripts/kani-nightly-plan.py --groups "$IN_GROUPS" --timeout "$IN_TIMEOUT" \
            --long-timeout "$IN_LONG" --memcap "$IN_MEMCAP" --maxpar "$IN_MAXPAR" --solver "$IN_SOLVER"

  shard:
    name: "kani ${{ matrix.group }} ${{ matrix.harness }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub-hosted job limit is 360; the plan keeps build + watchdog below it
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.plan.outputs.maxpar) }}
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: checkout percolator-prog
        uses: actions/checkout@v4
        with: { path: percolator-prog }
      - name: load canonical deployed refs
        id: refs
        run: grep -E '^[A-Z_]+=' percolator-prog/ci/deployed-refs.env >> "$GITHUB_OUTPUT"
      - name: checkout engine (path dependency, pinned to ENGINE_CI_SIBLING)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator, path: percolator, ref: '${{ steps.refs.outputs.ENGINE_CI_SIBLING }}', token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: dtolnay/rust-toolchain@stable
      - name: cache kani
        id: kcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}-v1
      - name: install kani ${{ env.KANI_VERSION }}
        run: |
          if ! cargo kani --version 2>/dev/null | grep -q "$KANI_VERSION"; then
            cargo install --locked kani-verifier --version "$KANI_VERSION"
          fi
          cargo kani setup
          cargo kani --version
      # CBMC's --z3 runs an external `z3` binary (kani does not bundle one). Installed only for
      # harnesses that ask for it (#[kani::solver(z3)], e.g. the growth-occ harnesses) or --solver z3.
      - name: install z3 (harness uses the z3 solver)
        if: matrix.z3
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq z3
          z3 --version
      - name: run harness (memory cap ${{ needs.plan.outputs.memcap }}, timeout ${{ matrix.timeout }})
        working-directory: percolator-prog
        env:
          GROUP: ${{ matrix.group }}
          HARNESS: ${{ matrix.harness }}
          TMO: ${{ matrix.timeout }}
          MEMCAP: ${{ needs.plan.outputs.memcap }}
          SOLVER: ${{ needs.plan.outputs.solver }}
        run: |
          nproc; free -m; df -h / | tail -1
          ./scripts/kani-nightly-shard.sh "$GROUP" "$HARNESS" "$TMO" "$RUNNER_TEMP/kn" "$MEMCAP" "$SOLVER"
          {
            echo "### kani $GROUP \`$HARNESS\`"
            echo '| harness | verdict | s | failed checks | covers | peak MiB |'
            echo '|---|---|---|---|---|---|'
            awk -F'\t' '{printf "| `%s` | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6}' "$RUNNER_TEMP/kn/verdicts.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload verdict + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-shard-${{ matrix.group }}-${{ matrix.idx }}
          path: ${{ runner.temp }}/kn
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: verdicts (red on FAILED / VACUOUS / ERROR / missing row)
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Only this run's shard artifacts (kani-shard-*): never an earlier kani-nightly-verdicts.
      - uses: actions/download-artifact@v4
        with: { pattern: kani-shard-*, path: shards }
      - name: merge and judge (one row per selected harness, else red)
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          set -uo pipefail
          mkdir -p out
          echo "$EXPECTED" | jq -r '.[]' > out/expected.txt
          ./scripts/kani-nightly-summary.sh shards out/expected.txt "$SHARD_RESULT" out > out/judge.log; rc=$?
          cat out/judge.log
          cat out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kani-nightly-verdicts
          path: out
          retention-days: 90
