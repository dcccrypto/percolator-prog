name: CI

# This repository had NO CI at all. The last runs were 2026-04-08 and failed.
# 241 Kani proofs and 25 test suites were running only when someone remembered.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (with sibling programs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout percolator-prog
        uses: actions/checkout@v4
        with: { path: percolator-prog }

      # The wrapper compiles the engine through `path = "../percolator"`, and mounts
      # the matcher / nft / stake .so for its cross-program suites. All four must sit
      # as siblings or large parts of the suite silently do not execute.
      - name: checkout engine (path dependency)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator, path: percolator, token: '${{ secrets.GITHUB_TOKEN }}' }
      # Sibling PROGRAMS are pinned to their DEPLOYED commits, not main. They are
      # separate on-chain programs that keep running their deployed build after we
      # upgrade the wrapper, so the wrapper must be tested against those bytes. Using
      # main here tests a program mix that will not exist on chain — and measurably
      # produces false failures: matcher main restored an lp_pda signer check
      # (33e1185, BUG-001) that deployed 585f492 does not have, which alone caused 11
      # spurious v16_cu failures.
      #
      # The ENGINE is deliberately NOT pinned: it compiles into the wrapper, so main
      # is exactly what we are shipping and what these tests must cover.
      - name: checkout matcher (pinned to the deployed commit)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-match, path: percolator-match, ref: '585f492', token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: checkout nft (pinned to the deployed commit)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-nft, path: percolator-nft, ref: 'f18da24', token: '${{ secrets.GITHUB_TOKEN }}' }
      # Stake likewise, and for an extra reason: main carries the 408-byte StakePool
      # layout that is deliberately NOT deployed (25 live pools are 392 bytes).
      - name: checkout stake (pinned to the deployed commit)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-stake, path: percolator-stake, ref: '474079f', token: '${{ secrets.GITHUB_TOKEN }}' }

      - uses: dtolnay/rust-toolchain@stable
      - name: install solana toolchain (cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: percolator-prog }

      - name: run suite and diff against the allowlist
        working-directory: percolator-prog
        run: ./scripts/ci-test.sh
