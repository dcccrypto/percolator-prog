name: CI

# This repository had NO CI at all. The last runs were 2026-04-08 and failed.
# 241 Kani proofs and 25 test suites were running only when someone remembered.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================================
  # CROSS-PROGRAM PARITY -- minutes, no toolchain, and it is the job that states the finding.
  #
  # The five-program crosscut suite below can only ever tell you about the mix of programs it
  # was handed. It cannot tell you that the mix is wrong. #441 (wrapper pins StakePool v3,
  # stake main emits v4) and the P5 nft regression (deployed nft requires wrapper header
  # VERSION 16, deployed wrapper stamps 17) both have the same shape: every repo internally
  # consistent, every suite green, nothing comparing the SHIPPED PAIR. This job compares it.
  # =========================================================================================
  parity:
    name: cross-program parity (constants, not bytes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout percolator-prog
        uses: actions/checkout@v4
        with: { path: percolator-prog, fetch-depth: 0 }
      # fetch-depth: 0 everywhere -- the check reads constants with `git show <ref>:<path>` at
      # DEPLOYED refs that are not the tip, so a shallow clone would make it unable to resolve
      # them. It hard-fails on an unresolvable ref rather than skipping the comparison.
      - name: checkout stake (full history)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-stake, path: percolator-stake, fetch-depth: 0, token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: checkout nft (full history)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-nft, path: percolator-nft, fetch-depth: 0, token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: parity check
        working-directory: percolator-prog
        run: ./scripts/parity-check.sh

  test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # ONE NFT PIN, as of 2026-08-29.
      #
      # This was a two-axis matrix (`deployed` vs `fix`) precisely because they DISAGREED: the
      # deployed nft had reverted two fixes that lived only on an unmerged branch, and the
      # `deployed` leg existed to assert that defect was still visible rather than allowlist it
      # away. That leg was designed to go RED the moment the fix reached the chain.
      #
      # It has. nft main now carries both fixes and is what devnet runs, so the two pins name
      # the same commit and the matrix would run the identical build twice. Collapsing it is
      # the last step of that fix, exactly as KNOWN_PARITY_DIVERGENCE.txt describes: "Deleting
      # the row is the last step of the fix, and after that the guard is a regression test."
      # The guard survives in scripts/parity-check.sh, which now compares the SHIPPED pair.
      # ---------------------------------------------------------------------------------
    steps:
      - name: checkout percolator-prog
        uses: actions/checkout@v4
        with: { path: percolator-prog }

      # Sibling pins live in exactly ONE file, ci/deployed-refs.env, and both this workflow
      # and scripts/parity-check.sh read them from there. They used to be hand-copied into
      # each checkout step, which is how the nft pin sat at f18da24 for a month after devnet
      # moved to cf56ba5. parity-check.sh fails the build if a SHA reappears inline here.
      - name: load canonical deployed refs
        id: refs
        run: grep -E '^[A-Z_]+=' percolator-prog/ci/deployed-refs.env >> "$GITHUB_OUTPUT"

      # The wrapper compiles the engine through `path = "../percolator"`, and mounts
      # the matcher / nft / stake .so for its cross-program suites. All four must sit
      # as siblings or large parts of the suite silently do not execute.
      - name: checkout engine (path dependency, pinned to ENGINE_CI_SIBLING)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator, path: percolator, ref: '${{ steps.refs.outputs.ENGINE_CI_SIBLING }}', token: '${{ secrets.GITHUB_TOKEN }}' }
      # Sibling PROGRAMS are pinned to their DEPLOYED commits, not main. They are
      # separate on-chain programs that keep running their deployed build after we
      # upgrade the wrapper, so the wrapper must be tested against those bytes. Using
      # main here tests a program mix that will not exist on chain — and measurably
      # produces false failures: matcher main restored an lp_pda signer check
      # (33e1185, BUG-001) that deployed 585f492 does not have, which alone caused 11
      # spurious v16_cu failures.
      #
      # THE ENGINE IS NOW PINNED TOO -- ENGINE_CI_SIBLING in ci/deployed-refs.env.
      #
      # It used to be deliberately unpinned, on the argument that the engine compiles
      # into the wrapper so "main is exactly what we are shipping". That argument only
      # holds while engine main is compatible with this tree, and the engine is a
      # SEPARATE REPOSITORY with its own merge queue. On 2026-09-09 engine main took
      # bf2fda46 ("Adopt upstream 92ed4a1a ... (layout 18)"), which added a field to
      # PortfolioLegV16. Every prog PR from that moment on failed `build + test` at
      # `error[E0063]: missing field kf_epoch_snap` -- in a test file none of those PRs
      # touched -- and the last green run on this repo was 2026-09-05. An unpinned
      # cross-repo dependency does not make CI test "what we ship"; it makes every PR's
      # verdict a function of what some other repo merged that hour, so a red job says
      # nothing about the PR and a green one is luck.
      #
      # ENGINE_CI_SIBLING is the engine the wrapper SHIPS AGAINST, i.e. the engine this
      # tree is written to compile and pass against. It is NOT a deployed ref and does
      # NOT belong with the *_DEPLOYED values: what is on chain is recorded separately
      # (ENGINE_DEPLOYED, and ~/percolator-ops/ledger/deployments.md). Moving it is a
      # deliberate, reviewable commit that runs the suite against the new engine --
      # which is the engine bump showing up as a diff instead of as a mystery.
      #
      # Upstream (aeyakovenko/percolator-prog) solves the same problem the other way:
      # it consumes the engine as a git dependency with an explicit
      # `rev = 394fd0bf2cb7d73df425eb3754dc3be1a0c44336` in Cargo.toml, so its engine is
      # pinned in-tree and it needs no CI pin. Our fork uses `path = "../percolator"`
      # (so the engine can be edited in lockstep), which moves that pin here.
      # NOTE on the nft pin: the DEPLOYED nft commit f18da24 existed only locally -- no
      # branch on dcccrypto/percolator-nft contained it, so GitHub could not serve it and the
      # checkout failed. It is now preserved as the branch `deployed/nft-f18da24`, which also
      # means the bytes running on chain finally have retrievable source.
      #
      # Sibling refs MUST be full 40-character SHAs. actions/checkout resolves `ref` by
      # running `git fetch origin <ref>`, and an abbreviated SHA is not a valid fetch refspec,
      # so a 7-char pin fails the checkout step outright. This CI had never once gone green
      # because of that -- every run since it was added died on "checkout matcher".
      # 2026-08-25: matcher redeployed 585f492 -> d4d4f1c (byte-verified), so this pin
      # moves with it. d4d4f1c INCLUDES the restored lp_pda signer check (33e1185,
      # BUG-001) -- which is exactly what the 11 previously-quarantined v16_cu failures
      # were: `init_matcher_context_with_data` calls matcher `process_init` passing the
      # wrapper's matcher-delegate PDA as `lp_pda` with is_signer=false, and the deployed
      # matcher now correctly rejects that. Those are a TEST-HARNESS limitation, not a
      # product regression: no production path creates matcher contexts (verified across
      # sdk/launch/keeper/indexer), and existing contexts are unaffected because the fill
      # path already required the signer.
      - name: checkout matcher (pinned to the deployed commit)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-match, path: percolator-match, ref: '${{ steps.refs.outputs.MATCHER_DEPLOYED }}', token: '${{ secrets.GITHUB_TOKEN }}' }
      # The nft pin is the matrix axis. `deployed` = cf56ba5 = what devnet runs = nft main.
      # `fix` = f18da24, preserved on the remote as branch `deployed/nft-f18da24`; it was the
      # PREVIOUSLY deployed nft and carries ce6b051 (accept wrapper VERSION 17) and 58911ab
      # (allowlist the DhSkE7u wrapper), neither of which was ever merged to nft main.
      #
      # 2026-09-15: this step mounts NFT_CI_SIBLING, not NFT_DEPLOYED, for the duration of
      # the layout-18 flag day. The wrapper's portfolio account is 9,539 B under the
      # layout-18 engine; the deployed nft 215842e vendors a 9,227-B mirror and its
      # `decode_portfolio` length gate rejects the account before it ever reads VERSION.
      # Mounting those two together does not test a mix that can exist -- the pair is
      # incompatible by construction until the nft deploy -- it just produces 7 failures
      # that say "the flag day has not happened yet", measured: 5 in v16_nft_e2e and 2 in
      # v16_five_program_crosscut, all of which pass against nft 74293a2e.
      #
      # NFT_DEPLOYED keeps its meaning (the bytes on chain) and keeps driving
      # scripts/parity-check.sh's DEPLOYED rows, which is why the pin is NOT simply moved:
      # bumping NFT_DEPLOYED to an undeployed commit was measured to turn the `parity` job
      # red on `DEPLOYED nft.header_version` (wrapper 15eb8b0c stamps 17, nft 74293a2e wants
      # 18) and would also be a false statement about the chain.
      #
      # The two pins converge again -- and this override is deleted -- when the nft and the
      # wrapper are deployed together and NFT_DEPLOYED moves to that commit.
      - name: checkout nft (pinned to the CI sibling the wrapper ships against)
        uses: actions/checkout@v4
        with:
          repository: dcccrypto/percolator-nft
          path: percolator-nft
          ref: ${{ steps.refs.outputs.NFT_CI_SIBLING }}
          token: '${{ secrets.GITHUB_TOKEN }}'
      # Stake likewise, and for an extra reason: main carries the 408-byte StakePool
      # layout that is deliberately NOT deployed (25 live pools are 392 bytes).
      - name: checkout stake (pinned to the deployed commit)
        uses: actions/checkout@v4
        with: { repository: dcccrypto/percolator-stake, path: percolator-stake, ref: '${{ steps.refs.outputs.STAKE_DEPLOYED }}', token: '${{ secrets.GITHUB_TOKEN }}' }

      - uses: dtolnay/rust-toolchain@stable
      - name: install solana toolchain (cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: percolator-prog }

      - name: run suite and diff against the allowlist
        working-directory: percolator-prog
        env:
          NFT_PIN: ci_sibling
        run: ./scripts/ci-test.sh
